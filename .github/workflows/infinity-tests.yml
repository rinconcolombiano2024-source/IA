name: INFINITY isolated unit tests

on:
  push:
    branches:
      - feature/infinity-3000-foundation
    paths:
      - 'src/infinity/**'
      - 'tests/infinity-*.test.js'
      - '.github/workflows/infinity-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infinity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run INFINITY unit tests only
        run: node --test tests/infinity-*.test.js
